<header
  class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-slate-800 bg-slate-900 px-6 py-4"
>
  <a
    routerLink="/predictions"
    class="group flex items-center gap-3 rounded-xl focus-visible:ring-2 focus-visible:ring-emerald-500/50 focus-visible:outline-none"
  >
    <span
      class="flex size-10 shrink-0 items-center justify-center rounded-xl border border-emerald-500/20 bg-emerald-500/10 text-emerald-400 transition-colors group-hover:border-emerald-500/40"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-6"
        aria-hidden="true"
      >
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
      </svg>
    </span>
    <span class="flex flex-col leading-tight">
      <span class="text-[11px] font-semibold tracking-[0.2em] text-emerald-400 uppercase">{{
        copy.brand.eyebrow
      }}</span>
      <span class="text-base font-bold tracking-tight text-white">{{ copy.brand.name }}</span>
    </span>
  </a>

  <nav [attr.aria-label]="copy.nav.ariaLabel" class="flex flex-wrap items-center gap-1">
    <a
      routerLink="/leaderboard"
      routerLinkActive
      (isActiveChange)="onActiveChange('/leaderboard', $event)"
      [attr.aria-current]="isActive('/leaderboard') ? 'page' : null"
      class="rounded-lg border-b-2 px-3 py-2 text-sm transition-colors focus-visible:ring-2 focus-visible:ring-emerald-500/50 focus-visible:outline-none"
      [class]="
        isActive('/leaderboard')
          ? 'border-emerald-400 bg-slate-800 font-semibold text-white'
          : 'border-transparent font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white'
      "
      >{{ copy.links.leaderboard }}</a
    >

    <a
      routerLink="/history"
      routerLinkActive
      (isActiveChange)="onActiveChange('/history', $event)"
      [attr.aria-current]="isActive('/history') ? 'page' : null"
      class="rounded-lg border-b-2 px-3 py-2 text-sm transition-colors focus-visible:ring-2 focus-visible:ring-emerald-500/50 focus-visible:outline-none"
      [class]="
        isActive('/history')
          ? 'border-emerald-400 bg-slate-800 font-semibold text-white'
          : 'border-transparent font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white'
      "
      >{{ copy.links.history }}</a
    >

    @if (isAdmin) {
      <a
        routerLink="/admin"
        routerLinkActive
        (isActiveChange)="onActiveChange('/admin', $event)"
        [attr.aria-current]="isActive('/admin') ? 'page' : null"
        class="rounded-lg border-b-2 px-3 py-2 text-sm transition-colors focus-visible:ring-2 focus-visible:ring-emerald-500/50 focus-visible:outline-none"
        [class]="
          isActive('/admin')
            ? 'border-emerald-400 bg-slate-800 font-semibold text-white'
            : 'border-transparent font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white'
        "
        >{{ copy.links.admin }}</a
      >
    }
  </nav>

  <div class="flex items-center gap-3">
    @if (email; as userEmail) {
      <span
        aria-hidden="true"
        class="flex size-9 shrink-0 items-center justify-center rounded-full bg-emerald-500/15 text-sm font-bold text-emerald-400 ring-1 ring-emerald-500/25"
        >{{ initial }}</span
      >
      <span class="max-w-[12rem] truncate text-sm font-medium text-slate-300">{{ userEmail }}</span>
    }

    <button
      type="button"
      (click)="logout()"
      class="inline-flex h-11 shrink-0 items-center gap-2 rounded-xl border border-slate-800 bg-slate-950/60 px-3.5 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-700 hover:text-white focus-visible:ring-2 focus-visible:ring-emerald-500/50 focus-visible:outline-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-4"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" x2="9" y1="12" y2="12" />
      </svg>
      <span>{{ copy.actions.logout }}</span>
    </button>
  </div>
</header>
